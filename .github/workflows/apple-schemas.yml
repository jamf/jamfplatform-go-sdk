name: Apple Schemas

# Keeps both embedded Apple schema tables current with apple/device-management:
# appleschemas/profiles/profiles.json (configuration profile payloads) and
# appleschemas/declarations/declarations.json (declarative device management declarations).
# Consumers validate legacy payloads and declarations against them before sending.
# See docs/STYLE.md, "Apple schemas generator".
#
# This is deliberately a scheduled job that opens a pull request, NOT a check on every pull request:
# a freshness check on the critical path would block unrelated work the day Apple publishes. It
# follows the pattern Dependabot already uses here for Go modules and actions — a scheduled,
# reviewable pull request — because a schema diff can turn a passing configuration into a failing
# one and so needs a human to look at it.
#
# Runs DAILY, which is more often than upstream moves, and deliberately so. An unrecognised key or
# declaration type is an **error** rather than a warning, because the platform silently discards
# one and the device never receives it — so while the table is stale a consumer blocks a
# configuration that would work. Apple publishes keys on a seed branch around OS betas and Jamf
# offers them in its UI immediately, which is faster than the SDK's release cadence; a daily
# refresh keeps the window before the table is current to a day rather than a month. The job costs
# a sparse clone and a diff.

on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A refresh must never race itself; a queued run picks up whatever the previous one committed.
concurrency:
  group: apple-schemas
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # apple-schemas discovers Apple's newest seed_OS_* branch and unions it with release, building
      # from release alone when no seed branch is open — which is the normal state between an OS
      # release and its next beta, since Apple promotes seed into release at GA and deletes it.
      #
      # The tables track upstream rather than accumulating a vocabulary Apple has retired, so a key
      # Apple withdraws leaves the SDK with it. That is deliberate, and it is also the one refresh
      # that turns a configuration which validates today into a failing one — so the generator's
      # report of what a regeneration dropped is captured here and carried into the pull request
      # body, where it reaches a reviewer instead of hiding in several thousand changed lines.
      - name: Regenerate the schema tables
        run: |
          set -euo pipefail
          make apple-schemas 2>&1 | tee /tmp/apple-schemas.log
          grep -E '^  - ' /tmp/apple-schemas.log > /tmp/apple-schemas-removals.txt || true
          if [ -s /tmp/apple-schemas-removals.txt ]; then
            echo "::warning::This refresh withdraws names the committed tables carry; see the pull request body."
          fi

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- appleschemas/profiles/profiles.json appleschemas/declarations/declarations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema tables are already current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Both tables are generated from one clone, so their provenance always agrees; report the
          # declaration table's, which names every branch unioned.
          table=appleschemas/declarations/declarations.json
          {
            echo "refs=$(jq -r '.refs | join(" + ")' "$table")"
            echo "release=$(jq -r .release "$table")"
            echo "commits=$(jq -r '.commits | to_entries | map("\(.key)@\(.value[0:12])") | join(", ")' "$table")"
            echo "declarations=$(jq -r '.declarations | length' "$table")"
            echo "payloads=$(jq -r '.payloads | length' appleschemas/profiles/profiles.json)"
          } >> "$GITHUB_OUTPUT"

      # A schema diff changes what the validators accept, so the suites that consume the tables must
      # still pass before a refresh is proposed. The generator's own tests run too: they read no
      # table, but a refresh that only passes against a broken generator proves nothing.
      - name: Test against the new tables
        if: steps.diff.outputs.changed == 'true'
        run: |
          go test ./appleschemas/... ./jamfplatform/blueprints/...
          cd tools && go test ./appleschemas/...

      # A fixed branch is force-pushed, so an unreviewed run does not accumulate branches and an
      # already-open pull request picks up the newer tables instead of a second one being opened.
      - name: Open or update the refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMITS: ${{ steps.diff.outputs.commits }}
          UPSTREAM_RELEASE: ${{ steps.diff.outputs.release }}
          UPSTREAM_REFS: ${{ steps.diff.outputs.refs }}
          DECLARATION_COUNT: ${{ steps.diff.outputs.declarations }}
          PAYLOAD_COUNT: ${{ steps.diff.outputs.payloads }}
        run: |
          set -euo pipefail
          branch="chore/apple-schemas-refresh"

          # The generator's removal report, if it found any, promoted from a log line nobody reads
          # into the body of the pull request a human is about to review.
          REMOVALS=""
          if [ -s /tmp/apple-schemas-removals.txt ]; then
            REMOVALS="$(printf '\n**Apple has withdrawn names the committed tables carry.** The tables track upstream rather than retaining a retired vocabulary, so these are gone from the SDK too — and each becomes an error in validation, so a configuration using one stops working:\n\n%s\n' "$(cat /tmp/apple-schemas-removals.txt)")"
          fi
          export REMOVALS

          cat > /tmp/commit-message <<EOF
          chore(appleschemas): refresh Apple schemas to ${UPSTREAM_RELEASE}

          Regenerated both embedded tables from apple/device-management
          (${UPSTREAM_COMMITS}).
          EOF

          cat > /tmp/pr-body <<EOF
          Apple published new schemas. This refreshes both embedded tables the SDK validates against.

          - Upstream: \`${UPSTREAM_COMMITS}\` (\`${UPSTREAM_RELEASE}\`)
          - Branches unioned: \`${UPSTREAM_REFS}\`
          - Now carrying ${PAYLOAD_COUNT} payload types and ${DECLARATION_COUNT} declaration types

          **Review focus** — most of a refresh is newly added keys, which is harmless. What matters is anything that could fail a configuration that works today, because these findings are errors rather than warnings:

          - a key whose \`type\` changed, or which gained \`required\`
          - a key whose \`enum\` lost a value, or whose \`min\`/\`max\` narrowed
          - a payload type or declaration type that disappeared upstream, which would start reporting as unrecognised
          - a change to \`statusItems\`, which would start reporting existing status subscriptions as unknown

          A key moving from the seed branch to release is expected and safe; watch instead for a key leaving the union entirely.
          ${REMOVALS}

          Opened by the Apple Schemas workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add appleschemas/profiles/profiles.json \
                  appleschemas/declarations/declarations.json
          git commit --file=/tmp/commit-message
          git push --force origin "$branch"

          # An open pull request gets its title and body rewritten as well as its tables: the body
          # carries the removal report, and one written on the day the pull request opened says
          # nothing about a withdrawal a later run force-pushed onto the branch.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" \
              --title "chore(appleschemas): refresh Apple schemas to ${UPSTREAM_RELEASE}" \
              --body-file /tmp/pr-body
            echo "An open refresh pull request already exists; its tables, title and body are updated."
            exit 0
          fi
          gh pr create \
            --head "$branch" \
            --title "chore(appleschemas): refresh Apple schemas to ${UPSTREAM_RELEASE}" \
            --body-file /tmp/pr-body
